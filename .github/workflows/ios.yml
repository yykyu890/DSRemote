name: iOS Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # 先确认仓库结构对不对：project.yml 必须在仓库根目录
      - name: 检查仓库结构
        run: |
          echo "当前目录：$(pwd)"
          ls -la
          if [ -f project.yml ]; then
            echo "✅ 根目录找到 project.yml"
          else
            echo "❌ 根目录没有 project.yml，下面是全仓库搜到的位置："
            find . -name project.yml -not -path '*/.*' || true
            exit 1
          fi
          if [ -d Sources ]; then
            echo "✅ Sources 目录存在"
            ls -la Sources
          else
            echo "❌ 根目录没有 Sources 目录"
            exit 1
          fi

      - name: 安装 xcodegen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: |
          xcodegen --version
          xcodegen generate --verbose

      - name: 编译（不签名，用 target 不依赖 scheme）
        run: |
          xcodebuild \
            -project DSRemote.xcodeproj \
            -target DSRemote \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: 打包成 .ipa
        run: |
          mkdir -p out/Payload
          cp -R build/Build/Products/Release-iphoneos/DSRemote.app out/Payload/
          cd out
          zip -qry DSRemote-unsigned.ipa Payload
          ls -lh DSRemote-unsigned.ipa

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: DSRemote-unsigned-ipa
          path: out/DSRemote-unsigned.ipa
          retention-days: 30
