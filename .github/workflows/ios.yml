name: iOS Build

# 推代码或手动点一下就跑；产出未签名 .ipa 供 Sideloadly 自签
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: 检查仓库结构
        run: |
          echo "工作目录：$(pwd)"
          ls -la
          if [ ! -f project.yml ]; then
            echo "❌ 根目录没有 project.yml"
            find . -name project.yml -not -path '*/.*' || true
            exit 1
          fi
          if [ ! -d Sources ]; then
            echo "❌ 根目录没有 Sources 目录"
            exit 1
          fi
          echo "✅ 结构没问题"

      - name: 源文件清单
        run: |
          echo "===== 根目录 ====="
          ls -la
          COUNT=$(find . -name "*.swift" -not -path "./.git/*" | wc -l | tr -d " ")
          echo "===== swift 文件数：$COUNT ====="
          find . -name "*.swift" -not -path "./.git/*" | sort | head -40
          echo "===== Sources 目录 ====="
          ls -la Sources || echo "根目录没有 Sources"
          echo "===== project.yml 的 sources 段 ====="
          grep -A4 "sources:" project.yml || true

      - name: 安装 xcodegen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: |
          xcodegen --version
          xcodegen generate
          echo "pbxproj 引用的 swift 文件数：$(grep -c '\.swift' DSRemote.xcodeproj/project.pbxproj || true)"
          echo "pbxproj 里的 Sources 组："
          grep -o '[A-Za-z_]*\.swift' DSRemote.xcodeproj/project.pbxproj | sort -u | head -20 || true

      - name: 构建设置
        run: |
          xcodebuild -project DSRemote.xcodeproj -target DSRemote -showBuildSettings 2>/dev/null \
            | grep -E "PRODUCT_NAME|EXECUTABLE_NAME|MACH_O_TYPE|SDKROOT|SUPPORTED_PLATFORMS|ARCHS" || true

      - name: 编译（不签名）
        run: |
          xcodebuild \
            -project DSRemote.xcodeproj \
            -target DSRemote \
            -sdk iphoneos \
            -configuration Release \
            SYMROOT="$(pwd)/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: 错误摘要（失败时只打印关键行）
        if: failure()
        run: |
          echo "================ 编译错误 ================"
          if [ -f build.log ]; then
            grep -n "error:" build.log | head -40 || true
            echo "================ 上下文 ================"
            grep -n -A3 "error:" build.log | head -120 || true
          else
            echo "没有 build.log"
          fi

      - name: 检查 app 内容
        run: |
          APP=$(find build -maxdepth 3 -name "DSRemote.app" | head -1)
          echo "app: $APP"
          ls -la "$APP"
          /usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP/Info.plist" || true
          if [ -f "$APP/DSRemote" ]; then
            file "$APP/DSRemote"
            lipo -info "$APP/DSRemote" || true
          else
            echo "NO_BINARY_IN_APP"
            find "$APP" -maxdepth 1 -type f | head -20
          fi

      - name: 打包成 .ipa
        run: |
          APP=$(find build -maxdepth 3 -name "DSRemote.app" | head -1)
          echo "找到 app：$APP"
          if [ -z "$APP" ]; then
            echo "❌ 没找到 DSRemote.app，下面是 build 目录："
            find build -maxdepth 3 -type d | head -30
            exit 1
          fi
          if [ ! -f "$APP/DSRemote" ]; then
            echo "NO_BINARY_ABORT"
            ls -la "$APP"
            exit 1
          fi
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out
          zip -qry DSRemote-unsigned.ipa Payload
          ls -lh DSRemote-unsigned.ipa

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: DSRemote-unsigned-ipa
          path: out/DSRemote-unsigned.ipa
          retention-days: 30
