name: iOS Build

on:
  push:
    branches: [main]
  workflow_dispatch:

# 所有命令都在 DSRemote/ 里执行（你的仓库多了一层目录）
defaults:
  run:
    working-directory: DSRemote

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: 检查仓库结构
        run: |
          echo "工作目录：$(pwd)"
          ls -la
          if [ ! -f project.yml ]; then
            echo "❌ 这里没有 project.yml"
            exit 1
          fi
          if [ ! -d Sources ]; then
            echo "❌ 这里没有 Sources 目录"
            exit 1
          fi
          echo "✅ 结构没问题"

      - name: 安装 xcodegen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: |
          xcodegen --version
          xcodegen generate

      - name: 编译（不签名）
        run: |
          xcodebuild \
            -project DSRemote.xcodeproj \
            -target DSRemote \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: 打包成 .ipa
        run: |
          mkdir -p out/Payload
          cp -R build/Build/Products/Release-iphoneos/DSRemote.app out/Payload/
          cd out
          zip -qry DSRemote-unsigned.ipa Payload
          ls -lh DSRemote-unsigned.ipa

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          path: DSRemote/out/DSRemote-unsigned.ipa
          retention-days: 30
