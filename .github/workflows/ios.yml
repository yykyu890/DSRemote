name: iOS Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: 安装 xcodegen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 编译（不签名，用 target 不依赖 scheme）
        run: |
          xcodebuild \
            -project DSRemote.xcodeproj \
            -target DSRemote \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: 打包成 .ipa
        run: |
          mkdir -p out/Payload
          cp -R build/Build/Products/Release-iphoneos/DSRemote.app out/Payload/
          cd out
          zip -qry DSRemote-unsigned.ipa Payload
          ls -lh DSRemote-unsigned.ipa

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: DSRemote-unsigned-ipa
          path: out/DSRemote-unsigned.ipa
          retention-days: 30
