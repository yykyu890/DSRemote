name: DSRemote
options:
  bundleIdPrefix: com.dsremote
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""

targets:
  DSRemote:
    type: application
    platform: iOS
    # 显式列出源文件，避免目录匹配不到导致"空 target"
    sources:
      - Sources/DSRemoteApp.swift
      - Sources/Core
      - Sources/UI
    settings:
      base:
        PRODUCT_NAME: DSRemote
        PRODUCT_BUNDLE_IDENTIFIER: com.dsremote.app
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: "NO"
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: Sources/Info.plist
        MACH_O_TYPE: mh_execute
        ENABLE_BITCODE: "NO"

schemes:
  DSRemote:
    build:
      targets:
        DSRemote: all
    run:
      config: Release
